<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Study Timer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="layout">


   {% include '_sidebar.html' %}

    <main class="main">

        <h1>
            ⏱️ Study Timer
        </h1>

        <p>
            Focus on your studies and track your study session.
        </p>


        <div class="timer-card">

            <div id="timer">
                25:00
            </div>


            <div class="timer-buttons">

                <button
                    onclick="startTimer()"
                    class="primary-btn"
                >

                    ▶ Start

                </button>


                <button
                    onclick="pauseTimer()"
                    class="edit-btn"
                >

                    ⏸ Pause

                </button>


                <button
                    onclick="resetTimer()"
                    class="delete-btn"
                >

                    🔄 Reset

                </button>

            </div>

        </div>


        <div class="form-card">

            <h2>
                💾 Save Study Session
            </h2>

            <form action="/save-session"
                  method="POST">

                <label>
                    Subject
                </label>

                <input
                    type="text"
                    name="subject"
                    placeholder="Example: Python"
                    required
                >

                <label>
                    Duration (minutes)
                </label>

                <input
                    type="number"
                    name="duration"
                    min="1"
                    placeholder="25"
                    required
                >

                <button
                    type="submit"
                    class="primary-btn"
                >

                    💾 Save Session

                </button>

            </form>

        </div>

    </main>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
