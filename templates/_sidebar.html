<div class="sidebar">
    <div class="logo">
        🎓 Study Planner
    </div>

    <nav>
        <a href="/" class="{% if request.path == '/' %}active{% endif %}"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="/planner" class="{% if request.path == '/planner' %}active{% endif %}"><i class="fa-solid fa-calendar"></i> Study Planner</a>
        <a href="/timetable" class="{% if request.path == '/timetable' %}active{% endif %}"><i class="fa-solid fa-calendar-days"></i> Timetable</a>
        <a href="/notes" class="{% if request.path == '/notes' %}active{% endif %}"><i class="fa-solid fa-note-sticky"></i> My Notes</a>
        <a href="/goals" class="{% if request.path == '/goals' %}active{% endif %}"><i class="fa-solid fa-bullseye"></i> Goals</a>
        <a href="/reminders" class="{% if request.path == '/reminders' %}active{% endif %}"><i class="fa-solid fa-bell"></i> Reminders</a>
        
        <a href="/analytics" class="{% if request.path == '/analytics' %}active{% endif %}"><i class="fa-solid fa-chart-pie"></i> Analytics</a>
        <a href="/achievements" class="{% if request.path == '/achievements' %}active{% endif %}"><i class="fa-solid fa-trophy"></i> Achievements</a>
    </nav>
    <div class="sidebar-logout">
        <form action="{{ url_for('logout') }}" method="POST" style="display: inline; width: 100%;">
            <button type="submit" class="logout-btn" style="background: none; border: none; cursor: pointer; color: inherit; width: 100%; text-align: left; padding: 10px 15px; font: inherit;">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </form>
    </div>
    
    
</div>
